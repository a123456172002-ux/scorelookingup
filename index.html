<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f0f5ff; /* 淺冰藍背景 */
      --card-bg: #ffffff; /* 純白卡片 */
      --text-main: #1e293b; /* 深藍灰文字 */
      --text-muted: #64748b; /* 次要灰色文字 */
      --primary: #2563eb; /* 經典藍色 */
      --primary-hover: #1d4ed8; /* 深藍 hover */
      --primary-light: #eff6ff; /* 超淺藍底色 */
      --border-color: #dbeaff; /* 淡藍色邊框 */
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    
    body { 
      background-color: var(--bg); 
      color: var(--text-main); 
      margin: 0; 
      padding: 40px 20px 90px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    
    .app { 
      width: 100%; 
      max-width: 480px; 
      transition: max-width 0.4s cubic-bezier(0.16, 1, 0.3, 1); 
    }

    /* 搜尋主卡片 */
    .search-box { 
      background: var(--card-bg); 
      padding: 32px 28px; 
      border-radius: var(--radius); 
      box-shadow: 0 10px 30px -10px rgba(37, 99, 235, 0.08), 0 4px 12px -2px rgba(0,0,0,0.02); 
      margin-bottom: 24px; 
      display: flex; 
      flex-direction: column;
      gap: 16px; 
      border: 1px solid var(--border-color);
    }

    .search-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 4px;
      text-align: center;
      letter-spacing: -0.02em;
    }

    .input-group {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    input, select { 
      flex: 1; 
      border: 1px solid var(--border-color); 
      border-radius: 12px; 
      padding: 14px 16px; 
      font-size: 15px; 
      transition: all 0.2s ease; 
      background: #f8fafc; 
      color: var(--text-main);
      outline: none;
    }

    input:focus, select:focus { 
      border-color: var(--primary); 
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    button { 
      background: var(--primary); 
      color: white; 
      border: none; 
      border-radius: 12px; 
      padding: 14px 24px; 
      cursor: pointer; 
      font-weight: 600; 
      font-size: 15px;
      transition: all 0.2s ease;
      white-space: nowrap;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }

    button:hover { 
      background: var(--primary-hover); 
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35);
    }

    button:active {
      transform: translateY(0);
    }
    
    /* 載入中提示 */
    #loading { 
      display: none; 
      text-align: center; 
      color: var(--primary); 
      font-weight: 500; 
      font-size: 14px;
      margin: 16px 0; 
    }

    /* 個人資訊藍色卡片 */
    .student-card { 
      background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); 
      color: white; 
      padding: 28px; 
      border-radius: var(--radius); 
      margin-bottom: 20px; 
      box-shadow: 0 12px 24px -6px rgba(30, 58, 138, 0.25); 
    }
    .student-card h2 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
    .student-info { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px; opacity: 0.9; font-size: 14px; }
    
    .score-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
    .single-col { grid-template-columns: 1fr !important; } 
    
    /* 單科成績卡片 */
    .score-item { 
      background: var(--card-bg); 
      padding: 20px; 
      border-radius: var(--radius); 
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.05); 
      text-align: center; 
      border: 1px solid var(--border-color);
    }
    .subject-name { font-size: 13px; font-weight: 500; color: var(--text-muted); margin-bottom: 6px; }
    .subject-score { font-size: 26px; font-weight: 700; color: var(--primary); }
    .class-avg { font-size: 12px; color: #94a3b8; margin-top: 6px; }
    
    /* 總分平均列 */
    .summary-bar { 
      background: var(--card-bg); 
      display: flex; 
      justify-content: space-around; 
      padding: 18px; 
      border-radius: 16px; 
      font-weight: 700; 
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-main);
    }

    /* 老師專用儀表板 */
    .teacher-panel { 
      background: var(--card-bg); 
      padding: 28px; 
      border-radius: var(--radius); 
      box-shadow: 0 10px 30px -10px rgba(37, 99, 235, 0.08); 
      margin-bottom: 20px; 
      border: 1px solid var(--border-color);
    }
    .table-container { 
      width: 100%; 
      overflow-x: auto; 
      background: var(--card-bg); 
      margin-top: 16px; 
      border-radius: 12px; 
      border: 1px solid var(--border-color); 
    }
    table { width: 100%; border-collapse: collapse; text-align: center; font-size: 14px; min-width: 550px; }
    th { background-color: var(--primary-light); color: var(--primary); font-weight: 600; padding: 14px 10px; border-bottom: 1px solid var(--border-color); }
    td { padding: 14px 10px; border-bottom: 1px solid var(--border-color); color: var(--text-main); }
    tr:hover { background-color: #f8fafc; }
    .highlight-cell { font-weight: 700; color: var(--primary); }
    
    .rank-1 { color: #d97706; font-weight: 700; }
    .rank-2 { color: #475569; font-weight: 700; }
    .rank-3 { color: #b45309; font-weight: 700; }
    .rank-normal { color: var(--text-main); font-weight: 600; }

    /* 置底頁尾 */
    footer#app-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 16px 0;
      text-align: center;
      background-color: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      border-top: 1px solid var(--border-color);
      font-size: 0.85em;
      color: var(--text-muted);
      z-index: 1000;
    }

    footer#app-footer button {
      background: none;
      border: none;
      color: var(--primary);
      cursor: pointer;
      font-weight: 500;
      padding: 0;
      box-shadow: none;
      text-decoration: underline;
    }

    footer#app-footer button:hover {
      background: none;
      transform: none;
      box-shadow: none;
      color: var(--primary-hover);
    }

    /* 彈出視窗 Modal */
    #adminModal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(4px);
      z-index: 9999;
      justify-content: center;
      align-items: center;
    }

    .modal-card {
      background: white;
      padding: 28px;
      border-radius: var(--radius);
      width: 320px;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      border: 1px solid var(--border-color);
    }
  </style>
</head>
<body>

  <div class="app" id="main-app">
    <div class="search-box">
      <div class="search-title">📘 學生成績查詢系統</div>
      <div class="input-group">
        <input type="text" id="sid" placeholder="請輸入學號" onkeypress="if(event.key==='Enter') query()">
        <button onclick="query()">查詢</button>
      </div>
    </div>
    
    <div id="loading">🔹 正在讀取資料，請稍候...</div>

    <div id="teacher-dashboard" style="display:none;">
      <div class="teacher-panel">
        <label style="font-weight:600; color: var(--text-main); display:block; margin-bottom:12px; font-size: 15px;"> Quentin 老師您好，請選擇要查詢的班級：</label>
        <select id="class-select" onchange="queryClassScores()">
          <option value="">-- 請選擇班級 --</option>
        </select>
        
        <div id="class-table-section" style="display:none;">
          <h3 id="class-title" style="margin-top:24px; font-size: 18px; color: var(--primary);">班級成績一覽表</h3>
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>座號</th>
                  <th>姓名</th>
                  <th>國文</th>
                  <th>英語</th>
                  <th>數學</th>
                  <th>自然</th>
                  <th>社會</th>
                  <th>總分</th>
                  <th>平均</th>
                  <th>班級排名</th> 
                </tr>
              </thead>
              <tbody id="class-table-body"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <div id="dashboard" style="display:none;">
      <div class="student-card">
        <h2 id="name">姓名</h2>
        <div class="student-info">
          <span>班級：<b id="cls">-</b></span>
          <span>座號：<b id="seat">-</b></span>
          <span>學號：<b id="sid-display">-</b></span>
        </div>
      </div>
      
      <div class="score-grid" id="score-container"></div>
      
      <div class="summary-bar" id="summary-bar" style="display:none;">
        <span>總分：<span id="total" style="color: var(--primary);">-</span></span>
        <span>平均：<span id="avg" style="color: var(--primary);">-</span></span>
      </div>
    </div>
  </div>

  <div id="maintenance-screen" style="display: none; text-align: center; padding: 80px 20px;">
    <h2 style="color: #ef4444; font-size: 1.8em; margin-bottom: 12px; font-weight: 700;">⚠️ 系統目前暫停開放</h2>
    <p style="color: var(--text-muted); font-size: 1.05em;">目前系統正在進行維護，請稍後再試。</p>
  </div>

  <footer id="app-footer">
    <span>坤坤老師管理系統</span> | 
    <button onclick="openAdminModal()">⚙️ 系統開關設定</button>
  </footer>

  <div id="adminModal">
    <div class="modal-card">
      <h3 style="margin-top: 0; font-size: 18px; color: var(--primary);">系統開關設定</h3>
      <p style="font-size: 0.85em; color: var(--text-muted); margin-bottom: 16px;">請輸入管理員密碼</p>
      <input type="password" id="adminPwd" placeholder="請輸入密碼" style="width: 100%; margin-bottom: 16px;">
      
      <div style="display: flex; gap: 10px; margin-bottom: 10px;">
        <button onclick="setSystemState(true)" style="flex: 1; background: #10b981; padding: 10px;">開啟系統</button>
        <button onclick="setSystemState(false)" style="flex: 1; background: #ef4444; padding: 10px;">關閉系統</button>
      </div>
      
      <button onclick="closeAdminModal()" style="background: #94a3b8; padding: 8px; width: 100%;">取消</button>
    </div>
  </div>

  <script>
    // 檢查系統開啟或關閉狀態
    window.addEventListener('DOMContentLoaded', function() {
      checkSystemStatus();
    });

    function checkSystemStatus() {
      google.script.run.withSuccessHandler(function(res) {
        var mainApp = document.getElementById("main-app");
        var maintenanceScreen = document.getElementById("maintenance-screen");

        if (!res.enabled) {
          if (mainApp) mainApp.style.display = "none";
          if (maintenanceScreen) maintenanceScreen.style.display = "block";
        } else {
          if (mainApp) mainApp.style.display = "block";
          if (maintenanceScreen) maintenanceScreen.style.display = "none";
        }
      }).getSystemStatus();
    }

    // 學生/老師查詢邏輯
    function query() {
      const id = document.getElementById('sid').value.trim();
      if(!id) return;
      
      document.getElementById('dashboard').style.display = 'none';
      document.getElementById('teacher-dashboard').style.display = 'none';
      document.getElementById('class-table-section').style.display = 'none';
      document.querySelector('.app').style.maxWidth = '480px';
      
      if (id.toLowerCase() === 'teacher quentin') {
        const password = prompt("請輸入管理員密碼：");
        if (password === null) {
          return; 
        } else if (password !== 'quentin0503') {
          alert("密碼錯誤，拒絕存取！");
          return;
        }
        
        document.getElementById('loading').style.display = 'block';
        google.script.run.withSuccessHandler(function(classes) {
          document.getElementById('loading').style.display = 'none';
          const select = document.getElementById('class-select');
          select.innerHTML = '<option value="">-- 請選擇班級 --</option>';
          classes.forEach(function(c) {
            let opt = document.createElement('option');
            opt.value = c; opt.innerText = c;
            select.appendChild(opt);
          });
          
          document.querySelector('.app').style.maxWidth = '850px'; 
          document.getElementById('teacher-dashboard').style.display = 'block';
        }).getClassList();
        return; 
      }

      // 個人學號查詢邏輯
      document.getElementById('loading').style.display = 'block';
      google.script.run.withSuccessHandler(function(res) {
        document.getElementById('loading').style.display = 'none';
        if(typeof res === 'string') return alert(res);
        
        document.getElementById('name').innerText = res.personal.info["姓名"];
        document.getElementById('cls').innerText = res.personal.info["班級"];
        document.getElementById('seat').innerText = res.personal.info["座號"];
        document.getElementById('sid-display').innerText = res.personal.info["學號"];
        
        const container = document.getElementById('score-container');
        container.innerHTML = '';
        
        if (!res.isFullDisplay) {
            container.classList.add('single-col');
            document.getElementById('summary-bar').style.display = 'none';
        } else {
            container.classList.remove('single-col');
            document.getElementById('total').innerText = res.personal.stats["總分"];
            document.getElementById('avg').innerText = res.personal.stats["平均"];
            document.getElementById('summary-bar').style.display = 'flex';
        }

        for (let sub in res.personal.scores) {
          let avgLabel = "班平均 ";
          container.innerHTML += `
            <div class="score-item">
              <div class="subject-name">${sub}</div>
              <div class="subject-score">${res.personal.scores[sub]}</div>
              <div class="class-avg">${avgLabel}${res.classAvg[sub]}</div>
            </div>
          `;
        }
        
        document.getElementById('dashboard').style.display = 'block';
      }).queryScore(id);
    }

    // 老師查詢整班成績
    function queryClassScores() {
      const className = document.getElementById('class-select').value;
      if (!className) {
        document.getElementById('class-table-section').style.display = 'none';
        return;
      }
      
      document.getElementById('loading').style.display = 'block';
      document.getElementById('class-table-section').style.display = 'none';
      
      google.script.run.withSuccessHandler(function(res) {
        document.getElementById('loading').style.display = 'none';
        if (typeof res === 'string') return alert(res);
        
        document.getElementById('class-title').innerText = className + ' 成績一覽表';
        const tbody = document.getElementById('class-table-body');
        tbody.innerHTML = '';
        
        res.forEach(function(st) {
          let rankClass = "rank-normal";
          let rStr = st.排名.toString();
          if(rStr.startsWith('1')) rankClass = "rank-1";
          else if(rStr.startsWith('2')) rankClass = "rank-2";
          else if(rStr.startsWith('3')) rankClass = "rank-3";

          tbody.innerHTML += `
            <tr>
              <td>${st.座號}</td>
              <td>${st.姓名}</td>
              <td>${st.scores.國文}</td>
              <td>${st.scores.英語}</td>
              <td>${st.scores.數學}</td>
              <td>${st.scores.自然}</td>
              <td>${st.scores.社會}</td>
              <td class="highlight-cell">${st.總分}</td>
              <td class="highlight-cell">${st.平均}</td>
              <td class="${rankClass}">${st.排名}</td> 
            </tr>
          `;
        });
        
        document.getElementById('class-table-section').style.display = 'block';
      }).queryClassScores(className);
    }

    // 系統開關控制選單邏輯
    function openAdminModal() { document.getElementById("adminModal").style.display = "flex"; }
    function closeAdminModal() { 
      document.getElementById("adminModal").style.display = "none"; 
      document.getElementById("adminPwd").value = "";
    }

    function setSystemState(targetState) {
      var pwd = document.getElementById("adminPwd").value;
      if (!pwd) { alert("請輸入密碼！"); return; }

      google.script.run.withSuccessHandler(function(res) {
        alert(res.message);
        if (res.success) {
          closeAdminModal();
          checkSystemStatus();
        }
      }).toggleSystemStatus(pwd, targetState);
    }
  </script>
</body>
</html>
